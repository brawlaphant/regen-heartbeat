# Yearly Heartbeat
#
# Triggered manually at solstices, equinoxes, and New Year per project spec.
# See .claude/specs/phase-2.md §4.5 and .claude/specs/roadmap.md Phase 2.

name: Yearly Heartbeat

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year YYYY (default: current year)'
        required: false
      model:
        description: 'Claude model'
        required: false
        type: choice
        options:
          - claude-opus-4-6
          - claude-sonnet-4-5-20250929
        default: claude-opus-4-6
      character:
        description: 'Character persona (empty = default neutral voice)'
        required: false
        type: choice
        options:
          - ''
          - narrator
          - regenai
          - governor
          - facilitator
          - advocate
          - voiceofnature
          - gaia
          - terranova
          - genesis
          - astraea
          - aquarius
          - cascadia
          - amazonia
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate target year
        id: year
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            echo "target=${{ github.event.inputs.year }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create MCP configuration
        run: |
          cat > /tmp/mcp-config.json << EOF
          {
            "mcpServers": {
              "regen-koi": {
                "command": "npx",
                "args": ["-y", "regen-koi-mcp@latest"],
                "env": {
                  "KOI_API_ENDPOINT": "${{ secrets.KOI_API_ENDPOINT }}"
                }
              }
            }
          }
          EOF

      - name: Generate yearly digest
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Generate a yearly digest for the Regen ecosystem.
            Read and follow ALL instructions in: .claude/agents/yearly-digest.md
            Target year: ${{ steps.year.outputs.target }}
            Character: ${{ github.event.inputs.character || '' }}
            IMPORTANT: This is an automated workflow. Complete autonomously.
            CRITICAL: You MUST use the Bash tool to write files. The Write tool does NOT persist to the filesystem in this CI environment. Use Bash with mkdir -p and cat heredoc (cat > path << 'DIGESTEOF' ... DIGESTEOF) to write the digest file to content/digests/. Always verify with ls that the file exists after writing.
          claude_args: |
            --model ${{ github.event.inputs.model || 'claude-opus-4-6' }}
            --max-turns 150
            --mcp-config /tmp/mcp-config.json
            --dangerously-skip-permissions

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "regen-heartbeat[bot]"
          git config user.email "heartbeat@regen.network"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add content/digests/
          git diff --cached --quiet || \
            (git commit -m "yearly: ${{ steps.year.outputs.target }}" && git push)
